<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Crawler Tin Tức</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="padding-top: 30px;">
    <h1>Công Cụ Crawler Tin Tức</h1>
    <p style="margin-bottom: 15px;"><a href="index.html">← Quay lại Trang Chủ</a></p>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="urlInput" placeholder="Nhập URL bài viết từ dantri.com.vn..." style="flex: 1; padding: 10px;">
      <button onclick="handleCrawl()" style="padding: 10px 20px; cursor: pointer;">Crawl Bài Viết</button>
    </div>

    <div id="status" style="margin-bottom: 15px; font-weight: bold;"></div>
    <pre id="jsonResult" style="background: #eef; padding: 15px; border-radius: 5px; max-height: 300px; overflow: auto;"></pre>
    <button id="btnSave" onclick="saveToStorage()" style="display: none; padding: 10px 20px; background: green; color: white; margin-top: 10px; cursor: pointer;">Lưu vào LocalStorage</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/crawler.js"></script>
  <script>
    let currentCrawledPost = null;

    async function handleCrawl() {
      const url = document.getElementById("urlInput").value.trim();
      const statusDiv = document.getElementById("status");
      const jsonPre = document.getElementById("jsonResult");
      const btnSave = document.getElementById("btnSave");

      if (!url) { alert("Vui lòng nhập URL!"); return; }

      statusDiv.innerText = "Đang cào dữ liệu...";
      jsonPre.innerText = "";
      btnSave.style.display = "none";

      try {
        currentCrawledPost = await crawlDanTriArticle(url);
        statusDiv.innerText = "Crawl thành công!";
        jsonPre.innerText = JSON.stringify(currentCrawledPost, null, 2);
        btnSave.style.display = "inline-block";
      } catch (err) {
        statusDiv.innerText = "Lỗi khi crawl. Hãy kiểm tra URL!";
      }
    }

    function saveToStorage() {
      if (!currentCrawledPost) return;
      let posts = JSON.parse(localStorage.getItem("posts_data") || "[]");
      const index = posts.findIndex(p => p.id === currentCrawledPost.id);
      if (index !== -1) posts[index] = currentCrawledPost;
      else posts.unshift(currentCrawledPost);

      localStorage.setItem("posts_data", JSON.stringify(posts));
      alert("Đã lưu vào LocalStorage! Bạn có thể về trang chủ để xem.");
    }
  </script>
</body>
</html>
