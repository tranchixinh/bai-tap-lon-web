<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Chi Tiết Bài Viết</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <nav><ul class="navbar" id="mainNav"></ul></nav>
    </div>
  </header>

  <main class="container" style="background: #fff; padding: 25px; margin-top: 20px; border-radius: 8px;">
    <p id="postCategory" style="color: #007bff; font-weight: bold;"></p>
    <h1 id="postTitle" style="margin: 15px 0;"></h1>
    <p id="postMeta" style="color: #777; font-size: 14px; margin-bottom: 20px;"></p>
    <div id="postImageContainer" style="text-align: center; margin-bottom: 20px;"></div>
    <p id="postExcerpt" style="font-weight: bold; font-size: 18px; margin-bottom: 20px;"></p>
    <div id="postContent" style="font-size: 16px; line-height: 1.8; white-space: pre-line;"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get("id");
      const posts = JSON.parse(localStorage.getItem("posts_data")) || [];

      const post = posts.find(p => p.id === postId);
      if (post) {
        document.getElementById("postCategory").innerText = `Chuyên mục: ${post.category}`;
        document.getElementById("postTitle").innerText = post.title;
        document.getElementById("postMeta").innerText = `Tác giả: ${post.author} | Đăng lúc: ${post.publishedAt} | Nguồn: ${post.source}`;
        document.getElementById("postExcerpt").innerText = post.excerpt;
        document.getElementById("postContent").innerText = post.content;
        if (post.image) {
          document.getElementById("postImageContainer").innerHTML = `<img src="${post.image}" style="max-width:100%; height:auto; border-radius:6px;">`;
        }
      } else {
        document.querySelector("main").innerHTML = "<h2>Không tìm thấy bài viết!</h2>";
      }
    });
  </script>
</body>
</html>
